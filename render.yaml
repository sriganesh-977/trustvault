services:
  - type: web
    name: trustvault-demo
    runtime: node
    plan: free
    branch: main
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: TRUSTVAULT_DEMO
        value: "1"
      - key: TRUSTVAULT_COOKIE_SECURE
        value: "1"
      - key: DATA_DIR
        value: /tmp/trustvault-demo
