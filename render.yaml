services:
  - type: web
    name: trustvault-demo
    runtime: python
    plan: free
    branch: main
    numInstances: 1
    buildCommand: pip install -r requirements.txt && npm install
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    envVars:
      - key: TRUSTVAULT_ENV
        value: development
      - key: TRUSTVAULT_DEMO
        value: "1"
      - key: TRUSTVAULT_COOKIE_SECURE
        value: "1"
      - key: TRUSTVAULT_DATA_DIR
        value: /tmp/trustvault-demo
